version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "5001:5001"
    depends_on:
      - mongo
      - redis
    environment:
      - PORT=5001
      - MONGO_URI=mongodb://mongo:27017/uniq
      - REDIS_URL=redis://redis:6379
      - ML_SERVICE_URL=http://ml:8001
      - FRONTEND_URL=http://frontend:3000
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1h}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - FROM_EMAIL=${FROM_EMAIL}
      - QUEUE_JOIN_COOLDOWN_SECONDS=${QUEUE_JOIN_COOLDOWN_SECONDS:-120}
      - QUEUE_JOIN_RATE_LIMIT_PER_MIN=${QUEUE_JOIN_RATE_LIMIT_PER_MIN:-3}
      - QUEUE_JOIN_RATE_LIMIT_PER_HOUR=${QUEUE_JOIN_RATE_LIMIT_PER_HOUR:-20}
      - TOKEN_EXPIRY_MINUTES=${TOKEN_EXPIRY_MINUTES:-5}
      - ROOT_ADMIN_EMAIL=${ROOT_ADMIN_EMAIL}
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5001
      - NEXT_PUBLIC_SOCKET_URL=http://localhost:5001
    depends_on:
      - backend
    restart: unless-stopped

  # ml:
  #   build:
  #     context: ./ml-service
  #     dockerfile: Dockerfile
  #   ports:
  #     - "8001:8001"
  #   restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  mongo_data: